# Prima ML ensemble (PyTorch). Deploy from the ml-service/ directory.
# Reached privately by the web app at prima-ml.internal:8000 — no public traffic needed,
# but http_service is kept so you can curl /health from the edge while debugging.
app = "prima-ml"
primary_region = "yyz"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # torch + Chronos model load is memory-hungry; bump to 4096mb if you see OOM kills.
  size = "shared-cpu-2x"
  memory = "2048mb"
